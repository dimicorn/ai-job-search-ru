[project]
name = "hh-agent"
version = "0.1.0"
description = "Полуавтоматические отклики на hh.ru: поиск по фильтрам, оценка и письма через Claude, отклик после подтверждения"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
hh-agent = "hh_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
