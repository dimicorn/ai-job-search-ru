[project]
name = "hh-agent"
version = "0.1.0"
description = "Агент откликов на hh.ru: поиск по фильтрам, оценка и письма через LLM, автоотклики с ответами на вопросы работодателя"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
hh-agent = "hh_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
