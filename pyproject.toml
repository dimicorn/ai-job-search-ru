[project]
name = "hh-agent"
version = "0.1.0"
description = "Агент откликов на hh.ru: поиск по фильтрам, оценка и письма через LLM, автоотклики с ответами на вопросы работодателя"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "telethon>=1.36",
]

[project.scripts]
hh-agent = "hh_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: длинные строки допустимы; E731: короткие lambda в таблицах метрик;
# B904: raise SystemExit с понятным сообщением вместо цепочки исключений.
ignore = ["E501", "E731", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
