# Частые вопросы: совпадение — ответ без вызова LLM. Скопируйте в faq.yaml и подставьте свои ответы.
# match — фрагменты вопроса (регистр не важен), unless — при них запись не подходит, answer — ответ.
# Агент сам дописывает сюда ответы LLM на вопросы, не зависящие от вакансии (learned: true).

- match: ["будет удобно прямо сейчас ответить", "удобно ли вам сейчас ответить"]
  answer: Да, удобно, готов ответить на вопросы.
- match: ["желаемый уровень заработной платы", "зарплатные ожидания", "ожидания по зарплате"]
  unless: ["миним", "прошл", "текущ"]
  answer: Мои зарплатные ожидания — … рублей на руки в месяц.
- match: ["когда готовы выйти", "срок выхода на работу"]
  answer: Готов выйти через … после принятия предложения.
