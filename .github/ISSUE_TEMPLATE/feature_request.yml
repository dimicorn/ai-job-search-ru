name: Идея
description: Предложить новую возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает
      description: Что сейчас неудобно или невозможно.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы работать
