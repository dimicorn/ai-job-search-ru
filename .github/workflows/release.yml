name: Release

# main защищён: изменения — только через PR, поэтому CHANGELOG.md обновляется в PR релиза
# (см. CONTRIBUTING.md), а на тег workflow только публикует GitHub Release с его разделом.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # git-cliff подтягивает номера PR через API
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
